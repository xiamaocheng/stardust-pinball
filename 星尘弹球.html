<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星尘弹球 · 打砖块</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1b2a5e 0%, #0a0f26 45%, #05070f 100%);
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px 14px 26px; min-height: 100%;
  }
  h1 { margin: 0; font-size: clamp(19px, 2.6vw, 28px); letter-spacing: 3px; font-weight: 700; }
  h1 span { color: #6ff2d6; }
  .sub { margin: 0; font-size: 13px; color: #9aa6d0; letter-spacing: 1px; }
  .wrap { width: min(880px, 100%); }
  #game {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 3;
    border-radius: 16px; background: #070b1d;
    box-shadow: 0 0 0 1px rgba(120,160,255,.28), 0 24px 60px rgba(0,0,0,.6), 0 0 90px rgba(80,120,255,.12) inset;
    cursor: none; touch-action: none;
  }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .keys { font-size: 12.5px; color: #98a4cc; line-height: 1.9; }
  kbd {
    display: inline-block; min-width: 20px; padding: 1px 7px; margin: 0 3px;
    border: 1px solid rgba(150,180,255,.4); border-bottom-width: 2px; border-radius: 6px;
    background: rgba(120,150,255,.12); color: #dbe4ff; font-size: 11.5px; font-family: inherit;
  }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(111,242,214,.5);
    background: linear-gradient(180deg, rgba(111,242,214,.22), rgba(111,242,214,.07));
    color: #d6fff5; font-size: 13.5px; letter-spacing: 1px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: linear-gradient(180deg, rgba(111,242,214,.36), rgba(111,242,214,.14)); }
</style>
</head>
<body>
  <h1>星尘<span>弹球</span></h1>
  <p class="sub">霓虹打砖块 · 单文件离线可玩</p>

  <div class="wrap">
    <canvas id="game" width="800" height="600" aria-label="星尘弹球游戏画面"></canvas>
    <div class="bar">
      <p class="keys"><kbd>移动鼠标</kbd>控制挡板 · <kbd>点击</kbd>或<kbd>空格</kbd>发射 · <kbd>P</kbd>暂停 · <kbd>R</kbd>重开 · 触屏可直接拖拽挡板</p>
      <span class="btns"><button id="pause">暂停 / 继续</button><button id="restart">重新开始</button></span>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');
  var W = cvs.width, H = cvs.height;

  var ROWS = 5, COLS = 10, BRICK_PAD = 8, TOP = 74, SIDE = 26, BH = 26;
  var BW = (W - SIDE * 2 - (COLS - 1) * BRICK_PAD) / COLS;
  var ROW_COLORS = ['#ff6b8b', '#ffa94d', '#ffe066', '#6ff2d6', '#7aa2ff'];

  var ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0 };
  var paddle = { w: 112, h: 14, x: (W - 112) / 2, y: H - 44 };
  var bricks = [];
  var trail = [];
  var stars = [];

  var status = 'ready';   // ready | playing | paused | over | win
  var score = 0, lives = 3, best = 0, combo = 0, hitFlash = 0, shake = 0;

  var BASE_SPEED = 330, MAX_SPEED = 620, speed = BASE_SPEED;

  for (var s = 0; s < 90; s++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, t: Math.random() * 6.28 });
  }

  /* ---------- audio ---------- */
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.08));
      o.stop(actx.currentTime + (dur || 0.08));
    } catch (e) { /* 无音频环境时静默降级 */ }
  }

  /* ---------- build & reset ---------- */
  function build() {
    bricks = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: SIDE + c * (BW + BRICK_PAD),
          y: TOP + r * (BH + BRICK_PAD),
          w: BW, h: BH,
          color: ROW_COLORS[r],
          alive: true,
          points: (ROWS - r) * 2
        });
      }
    }
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
    trail.length = 0;
  }

  function launch() {
    var a = (-Math.PI / 2) + (Math.random() * 0.5 - 0.25);
    speed = BASE_SPEED;
    ball.vx = Math.cos(a) * speed;
    ball.vy = Math.sin(a) * speed;
    status = 'playing';
    beep(520, 0.07, 'triangle', 0.05);
  }

  function newGame() {
    build();
    score = 0; lives = 3; combo = 0; speed = BASE_SPEED;
    paddle.x = (W - paddle.w) / 2;
    stickBall();
    status = 'ready';
  }

  /* ---------- input ---------- */
  function pointerX(clientX) {
    var rect = cvs.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  function movePaddle(px) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, px - paddle.w / 2));
  }
  function primaryAction() {
    if (status === 'ready') { launch(); }
    else if (status === 'over' || status === 'win') { newGame(); }
    else if (status === 'paused') { status = 'playing'; }
  }

  cvs.addEventListener('mousemove', function (e) { movePaddle(pointerX(e.clientX)); });
  cvs.addEventListener('mousedown', function (e) { e.preventDefault(); primaryAction(); });
  cvs.addEventListener('touchstart', function (e) {
    if (e.touches.length) { movePaddle(pointerX(e.touches[0].clientX)); primaryAction(); }
    e.preventDefault();
  }, { passive: false });
  cvs.addEventListener('touchmove', function (e) {
    if (e.touches.length) movePaddle(pointerX(e.touches[0].clientX));
    e.preventDefault();
  }, { passive: false });
  function togglePause() {
    if (status === 'playing') status = 'paused';
    else if (status === 'paused') status = 'playing';
  }

  window.addEventListener('keydown', function (e) {
    if (!e.key) return;
    if (e.code === 'Space') {
      if (e.repeat) return;
      e.preventDefault();
      primaryAction();
    } else if (e.repeat) return;
    var k = e.key.toLowerCase();
    if (k === 'p') { togglePause(); }
    else if (k === 'r') { newGame(); }
    else if (k === 'arrowleft') { movePaddle(paddle.x + paddle.w / 2 - 34); }
    else if (k === 'arrowright') { movePaddle(paddle.x + paddle.w / 2 + 34); }
  });
  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('pause').addEventListener('click', togglePause);

  /* ---------- collision ---------- */
  function clampMinVy(minRatio) {
    var minVy = speed * minRatio;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
      var n = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = ball.vx / n * speed;
      ball.vy = ball.vy / n * speed;
    }
  }

  function hitBrick(b) {
    var cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    var cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    var dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) return false;
    var horizontal = Math.abs(dx) > Math.abs(dy);
    // 砖角附近（dx≈dy）时以进入方向定轴，避免选错轴穿入邻砖
    if (Math.abs(Math.abs(dx) - Math.abs(dy)) < 1.5) horizontal = Math.abs(ball.vx) > Math.abs(ball.vy);
    if (horizontal) {
      ball.vx = dx >= 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
      // 沿法线把球推出接触面，防止同一 substep 序列里重复命中抖动
      ball.x = dx >= 0 ? b.x + b.w + ball.r : b.x - ball.r;
    } else {
      ball.vy = dy >= 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
      ball.y = dy >= 0 ? b.y + b.h + ball.r : b.y - ball.r;
    }
    clampMinVy(0.26);
    return true;
  }

  function stepBall(dt) {
    var dist = Math.hypot(ball.vx, ball.vy) * dt;
    var steps = Math.max(1, Math.min(8, Math.ceil(dist / ball.r)));
    for (var i = 0; i < steps; i++) {
      ball.x += ball.vx * dt / steps;
      ball.y += ball.vy * dt / steps;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(300, 0.04, 'sine', 0.03); }
      else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(300, 0.04, 'sine', 0.03); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); beep(300, 0.04, 'sine', 0.03); }

      // paddle
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        var rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        rel = Math.max(-1, Math.min(1, rel));
        var ang = rel * (Math.PI / 3);
        ball.vy = -Math.abs(Math.cos(ang) * speed);
        ball.vx = Math.sin(ang) * speed;
        ball.y = paddle.y - ball.r - 0.5;
        combo = 0;
        clampMinVy(0.32);
        beep(220, 0.06, 'square', 0.04);
      }

      // bricks
      for (var j = 0; j < bricks.length; j++) {
        var b = bricks[j];
        if (!b.alive) continue;
        if (hitBrick(b)) {
          b.alive = false;
          combo++;
          score += b.points * 10 + combo * 2;
          if (score > best) best = score;
          hitFlash = 0.16; shake = 3;
          beep(640 + combo * 40, 0.06, 'triangle', 0.05);
          var remain = 0;
          for (var m = 0; m < bricks.length; m++) if (bricks[m].alive) remain++;
          speed = Math.min(MAX_SPEED, speed + 6);
          var norm = Math.hypot(ball.vx, ball.vy) || 1;
          ball.vx = ball.vx / norm * speed; ball.vy = ball.vy / norm * speed;
          if (remain === 0) { status = 'win'; beep(880, 0.22, 'triangle', 0.06); }
          break;
        }
      }

      // fell out
      if (ball.y - ball.r > H) {
        lives--;
        combo = 0;
        shake = 6;
        beep(140, 0.2, 'sawtooth', 0.05);
        if (lives <= 0) { status = 'over'; }
        else { stickBall(); status = 'ready'; speed = BASE_SPEED; }
        return;
      }
    }
  }

  /* ---------- draw ---------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#05070f');
    ctx.fillStyle = g; ctx.fillRect(-8, -8, W + 16, H + 16);

    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t / 900 + st.t));
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < bricks.length; j++) {
      var b = bricks[j];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      roundRect(b.x, b.y, b.w, b.h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff';
      roundRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.35, 5); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // paddle
    ctx.fillStyle = '#6ff2d6';
    ctx.shadowColor = '#6ff2d6'; ctx.shadowBlur = 18;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
    ctx.shadowBlur = 0;

    // trail + ball
    for (var k = 0; k < trail.length; k++) {
      ctx.globalAlpha = (k + 1) / trail.length * 0.4;
      ctx.fillStyle = '#9db8ff';
      ctx.beginPath(); ctx.arc(trail[k].x, trail[k].y, ball.r * (k + 1) / trail.length, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#8fb4ff'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;

    if (hitFlash > 0) { ctx.globalAlpha = hitFlash * 2; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

    // HUD
    ctx.font = '700 20px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#dbe4ff'; ctx.textAlign = 'left';
    ctx.fillText('得分 ' + score, 22, 34);
    ctx.font = '400 13px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#8f9cc8';
    ctx.fillText('本局最高 ' + best, 22, 54);

    ctx.textAlign = 'right';
    ctx.font = '700 20px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#dbe4ff';
    ctx.fillText('速度 ' + Math.round(speed), W - 22, 34);
    ctx.font = '400 13px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#8f9cc8';
    ctx.fillText('剩余 ' + countAlive() + ' 块', W - 22, 54);

    ctx.textAlign = 'left';
    for (var l = 0; l < lives; l++) {
      ctx.fillStyle = '#ff6b8b';
      ctx.beginPath(); ctx.arc(150 + l * 22, 27, 7, 0, 6.2832); ctx.fill();
    }

    if (combo >= 3 && status === 'playing') {
      ctx.textAlign = 'center';
      ctx.font = '700 16px system-ui, sans-serif';
      ctx.fillStyle = '#ffe066';
      ctx.fillText('连击 x' + combo, W / 2, 40);
    }

    if (status !== 'playing') overlay();
    ctx.restore();
  }

  function overlay() {
    ctx.fillStyle = 'rgba(5,7,15,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    var title = '', tip = '';
    if (status === 'ready') { title = '点击发射星尘'; tip = '挡板跟手移动，落点决定反弹角度'; }
    else if (status === 'paused') { title = '已暂停'; tip = '按 P 或点击继续'; }
    else if (status === 'over') { title = '游戏结束'; tip = '得分 ' + score + ' · 点击或按 R 再来一局'; }
    else if (status === 'win') { title = '全部通关！'; tip = '得分 ' + score + ' · 点击或按 R 再来一局'; }
    ctx.fillStyle = '#e8ecff';
    ctx.font = '700 ' + (status === 'ready' ? '30' : '40') + 'px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 8);
    ctx.fillStyle = '#9aa6d0';
    ctx.font = '400 15px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText(tip, W / 2, H / 2 + 26);
  }

  function countAlive() {
    var n = 0;
    for (var i = 0; i < bricks.length; i++) if (bricks[i].alive) n++;
    return n;
  }

  /* ---------- loop ---------- */
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
  var clock = (window.performance && window.performance.now) ? function () { return window.performance.now(); } : function () { return Date.now(); };
  var last = clock();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (status === 'playing') {
      stepBall(dt);
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 10) trail.shift();
    } else if (status === 'ready') {
      stickBall();
    }
    if (hitFlash > 0) hitFlash -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 18);
    draw(now);
    raf(frame);
  }

  newGame();
  raf(frame);
})();
</script>
</body>
</html>
